[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
(
  /(
        \.eggs
            | \.git
                | \.hg
                    | \.mypy_cache
                        | \.tox
                            | \.venv
                                | _build
                                    | buck-out
                                        | build
                                            | dist
                                              )/
                                                | alembic/
                                                )
                                                '''

                                                [tool.ruff]
                                                line-length = 88
                                                target-version = "py311"
                                                exclude = [
                                                    ".git",
                                                        ".mypy_cache",
                                                            ".ruff_cache",
                                                                ".venv",
                                                                    "venv",
                                                                        "__pypackages__",
                                                                            "_build",
                                                                                "build",
                                                                                    "dist",
                                                                                        "alembic",
                                                                                        ]

                                                                                        [tool.ruff.lint]
                                                                                        select = ["E", "F", "B", "N", "UP", "A", "C4", "SIM", "ARG"]
                                                                                        ignore = ["I001"]

                                                                                        [tool.pytest.ini_options]
                                                                                        minversion = "7.0"
                                                                                        addopts = "-ra -q --cov=app --cov-report=term-missing --cov-report=xml"
                                                                                        testpaths = ["tests"]
                                                                                        pythonpath = ["."]
                                                                                        asyncio_mode = "auto"
                                                                                        
